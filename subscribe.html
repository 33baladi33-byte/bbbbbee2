<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zertiva B2 - الاشتراك</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --card-border: rgba(226, 232, 240, 0.1);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --blue: #38bdf8;
            --blue-dark: #347da3;
            --purple: #a78bfa;
            --green: #5eead4;
            --shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        /* Header */
        header {
            padding: 20px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
            text-align: center;
        }

        .back-home {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .back-home:hover {
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 60px 20px 30px;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin: 0 0 15px;
        }

        .hero h1 span {
            color: var(--blue);
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        .hero p {
            color: var(--muted);
            font-size: 1rem;
        }

        /* Duration Switcher */
        .duration-switch {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px auto 50px;
            flex-wrap: wrap;
            max-width: 600px;
            padding: 5px;
            border: 1px solid var(--card-border);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.03);
        }

        .duration-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            flex: 1;
        }

        .duration-btn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }

        .duration-btn.active {
            background: rgba(56, 189, 248, 0.2);
            color: #fff;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        /* Pricing Grid */
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            align-items: stretch;
        }

        .plan {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--card-border);
            border-radius: 25px;
            padding: 30px;
            position: relative;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }

        .plan:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .plan.pro {
            border-color: var(--blue);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4), 0 0 45px rgba(56, 189, 248, 0.07);
            transform: translateY(-10px);
        }

        .plan.pro:hover {
            transform: translateY(-15px);
        }

        .plan.max {
            border-color: rgba(167, 139, 250, 0.3);
        }

        .plan-badge {
            position: absolute;
            top: -12px;
            right: 20px;
            background: var(--blue);
            color: #06131b;
            padding: 6px 15px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 800;
        }

        .plan.max .plan-badge {
            background: var(--purple);
            color: white;
        }

        .plan-name {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .plan-price {
            margin: 20px 0;
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .price-value {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1;
        }

        .price-period {
            color: var(--muted);
            font-size: 14px;
        }

        .old-price {
            color: #64748b;
            text-decoration: line-through;
            font-size: 14px;
        }

        .save-tag {
            background: rgba(94, 234, 212, 0.2);
            color: var(--green);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
            margin-top: 10px;
        }

        .deals-list {
            margin-top: 10px;
        }

        .deal {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 5px;
        }

        .features {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            flex-grow: 1;
        }

        .features li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .features li::before {
            content: '✓';
            background: rgba(56, 189, 248, 0.2);
            color: var(--blue);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .plan.max .features li::before {
            background: rgba(167, 139, 250, 0.2);
            color: var(--purple);
        }

        .plan button {
            margin-top: auto;
            background: var(--blue);
            color: #06131b;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .plan.max button {
            background: var(--purple);
            color: white;
        }

        .plan button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        /* Stats Section */
        .stats-section {
            max-width: 800px;
            margin: 80px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            text-align: center;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 16px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--blue);
        }

        .stat-label {
            color: var(--muted);
            font-size: 14px;
            margin-top: 5px;
        }

        /* Footer */
        footer {
            margin-top: 80px;
            border-top: 1px solid var(--card-border);
            padding: 40px;
            text-align: center;
            background: #0a0e1a;
        }

        .footer-links {
            margin-top: 10px;
        }

        .footer-links a {
            color: var(--blue);
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .pricing-grid {
                grid-template-columns: 1fr;
                max-width: 400px;
            }

            .plan.pro {
                transform: none;
                order: -1;
            }

            .plan.pro:hover {
                transform: translateY(-5px);
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<script>

        },
        '60': {

        }

    const grid = document.getElementById('pricingGrid');
    const durationBtns = document.querySelectorAll('.duration-btn');

    function getEmail() {
        let email = 'غير مسجل';
        if (auth.currentUser) {
            email = auth.currentUser.email;
        } else {
            email = localStorage.getItem('zertiva_email') || 'غير مسجل';
        }
        return email;
    }

    function renderPlans(duration) {
        const data = plansData[duration];
        if (!data) return;
        
        let html = '';
        
        // Standard
        html += `
            <div class="plan">
                <h3 class="plan-name">${data.standard.name}</h3>
                <div class="plan-price">
                    <span class="price-value">${data.standard.price}</span>
                    <span class="price-period">DH / ${data.standard.period}</span>
                </div>
                <ul class="features">
                    ${data.standard.features.map(f => `<li>${f}</li>`).join('')}
                </ul>
                <button onclick="goToWhatsApp('${data.standard.name}', '${data.standard.period}', '${data.standard.price}')">ابدأ مجاناً</button>
            </div>
        `;
        
        // Pro
        const proBadge = duration === '30' || duration === '60' || duration === '90' ? '<div class="plan-badge">الأكثر شعبية</div>' : '';
        const dealsHTML = data.pro.deals ? `<div class="deals-list">${data.pro.deals.map(d => `<div class="deal">${d}</div>`).join('')}</div>` : '';
        html += `
            <div class="plan pro">
                ${proBadge}
                <h3 class="plan-name">${data.pro.name}</h3>
                <div class="old-price">${data.pro.oldPrice}</div>
                <div class="plan-price">
                    <span class="price-value">${data.pro.price}</span>
                    <span class="price-period">DH / ${data.pro.period}</span>
                </div>
                <div class="save-tag">${data.pro.save}</div>
                ${dealsHTML}
                <ul class="features">
                    ${data.pro.features.map(f => `<li>${f}</li>`).join('')}
                </ul>
                <button onclick="goToWhatsApp('${data.pro.name}', '${data.pro.period}', '${data.pro.price}')">اشترك الآن</button>
            </div>
        `;

        // Pro Max
        const maxDealsHTML = data.max.deals ? `<div class="deals-list">${data.max.deals.map(d => `<div class="deal">${d}</div>`).join('')}</div>` : '';
        html += `
            <div class="plan max">
                <div class="plan-badge">Premium</div>
                <h3 class="plan-name">${data.max.name}</h3>
                <div class="old-price">${data.max.oldPrice}</div>

        grid.innerHTML = html;

    function goToWhatsApp(plan, duration, price) {
        const email = getEmail();
        const message = `مرحباً، أريد الانضمام إلى عائلة سهلة:\nالمدة: ${duration}\nالخطة: ${plan}\nالثمن: ${price} DH\nالإيميل: ${email}`;
        const encoded = encodeURIComponent(message);
        window.open(`https://wa.me/212665881925?text=${encoded}`, '_blank');
    }

    // تبديل المدة
    durationBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            durationBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderPlans(btn.dataset.duration);
        });
    });

    // التشغيل الافتراضي (شهر واحد)
    renderPlans('30');
    
    // مراقبة تغيير المستخدم لتحديث البريد (إذا غيرت الحساب أثناء التواجد بالصفحة)
    auth.onAuthStateChanged(user => {
        if (user) {
            console.log('المستخدم مسجل، البريد: ', user.email);
        }
    });
